services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber_appointment
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber_appointment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: